# Valores para rodar na máquina (./gradlew bootRun --parallel).
# No perfil "apps" do docker compose, as variáveis de ambiente sobrescrevem host e porta.
spring:
  application:
    name: mortician-service
  datasource:
    url: jdbc:postgresql://localhost:5436/mortician
    username: workshop
    password: workshop
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: mortician-service
      auto-offset-reset: earliest
      properties:
        # O padrão .*\.DLT descobre DLTs criadas depois da subida em até 5 s.
        metadata.max.age.ms: 5000
    listener:
      ack-mode: record

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    # Além do console, cada serviço loga em logs/mortician-service.log: é onde o grep da apresentação procura.
    name: ${LOG_DIR:logs}/mortician-service.log
  level:
    # O cliente Kafka é muito verboso em INFO; deixamos os logs para a história da saga.
    org.apache.kafka: WARN
  pattern:
    # Toda linha com uma transferência no MDC ganha "transferId=1042 cid=TRF-1042.DEB-a1 "
    # (linhas sem contexto ficam como estão). É o que faz o grep da apresentação funcionar.
    correlation: "%replace(transferId=%X{transferId} ){'^transferId= $', ''}%replace(cid=%X{cid} ){'^cid= $', ''}"
