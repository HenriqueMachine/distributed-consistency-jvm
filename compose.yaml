# Ambiente da apresentação.
#
#   docker compose up -d                         só a infra: Kafka, Kafka UI e um Postgres por serviço
#   ./gradlew bootRun --parallel                 os serviços, na sua máquina (JDK 21)
#
#   docker compose --profile apps up -d --build  tudo no Docker, para quem não tem JDK
#
# Portas no host:
#   8080 Kafka UI · 8081 transfer · 8082 account · 8083 pix · 8084 mortician
#   9094 Kafka · 5433 transfers-db · 5434 accounts-db · 5435 pix-db · 5436 mortician-db
name: distributed-consistency-jvm

x-postgres: &postgres
  image: postgres:17-alpine
  environment: &postgres-env
    POSTGRES_USER: workshop
    POSTGRES_PASSWORD: workshop
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U workshop"]
    interval: 2s
    retries: 30

x-service: &service
  profiles: ["apps"]
  build: &service-build
    context: .
    target: service
  healthcheck:
    test: ["CMD-SHELL", "curl -fs localhost:8080/actuator/health || exit 1"]
    interval: 3s
    retries: 40
  volumes:
    # Os logs vão para ./logs também no Docker: o grep é o mesmo nos dois modos.
    - ./logs:/logs
  environment: &service-env
    SERVER_PORT: 8080
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    LOG_DIR: /logs
    # Troque para "json" para ver os logs no formato ECS (passo 8).
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópicos só nascem declarados pelos serviços, com o número certo de partições.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 3s
      retries: 30

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: distributed-consistency-jvm
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  transfers-db:
    <<: *postgres
    ports:
      - "5433:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: transfers

  accounts-db:
    <<: *postgres
    ports:
      - "5434:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: accounts

  pix-db:
    <<: *postgres
    ports:
      - "5435:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: pix

  mortician-db:
    <<: *postgres
    ports:
      - "5436:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: mortician

  transfer-service:
    <<: *service
    build:
      <<: *service-build
      args:
        SERVICE: transfer-service
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
      transfers-db:
        condition: service_healthy
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://transfers-db:5432/transfers

  account-service:
    <<: *service
    build:
      <<: *service-build
      args:
        SERVICE: account-service
    ports:
      - "8082:8080"
    depends_on:
      kafka:
        condition: service_healthy
      accounts-db:
        condition: service_healthy
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://accounts-db:5432/accounts

  pix-service:
    <<: *service
    build:
      <<: *service-build
      args:
        SERVICE: pix-service
    ports:
      - "8083:8080"
    depends_on:
      kafka:
        condition: service_healthy
      pix-db:
        condition: service_healthy
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://pix-db:5432/pix

  mortician-service:
    <<: *service
    build:
      <<: *service-build
      args:
        SERVICE: mortician-service
    ports:
      - "8084:8080"
    depends_on:
      kafka:
        condition: service_healthy
      mortician-db:
        condition: service_healthy
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://mortician-db:5432/mortician
