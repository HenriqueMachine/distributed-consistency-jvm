# Valores para rodar na máquina (./gradlew bootRun --parallel).
# No perfil "apps" do docker compose, as variáveis de ambiente sobrescrevem host e porta.
spring:
  application:
    name: pix-service
  datasource:
    url: jdbc:postgresql://localhost:5435/pix
    username: workshop
    password: workshop
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: pix-service
      auto-offset-reset: earliest
    listener:
      # Commit do offset depois de cada mensagem processada: at-least-once (slide 32).
      ack-mode: record

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

logging:
  file:
    # Além do console, cada serviço loga em logs/pix-service.log: é onde o grep da apresentação procura.
    name: ${LOG_DIR:logs}/pix-service.log
  level:
    # O cliente Kafka é muito verboso em INFO; deixamos os logs para a história da saga.
    org.apache.kafka: WARN
  pattern:
    # Toda linha com uma transferência no MDC ganha "transferId=1042 cid=TRF-1042.DEB-a1 "
    # (linhas sem contexto ficam como estão). É o que faz o grep da apresentação funcionar.
    correlation: "%replace(transferId=%X{transferId} ){'^transferId= $', ''}%replace(cid=%X{cid} ){'^cid= $', ''}"

# Circuit breaker do SPI (slide 40). Passou de 50% de falhas na janela, o circuito abre e
# pausa o consumidor; depois de 10 s ele deixa uma chamada passar para testar (HALF_OPEN).
resilience4j:
  circuitbreaker:
    instances:
      spi:
        failure-rate-threshold: 50
        sliding-window-size: 20
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - workshop.saga.pix.infra.spi.SpiUnavailableException
