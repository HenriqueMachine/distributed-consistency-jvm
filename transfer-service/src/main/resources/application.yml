# Valores para rodar na máquina (./gradlew bootRun --parallel).
# No perfil "apps" do docker compose, as variáveis de ambiente sobrescrevem host e porta.
spring:
  application:
    name: transfer-service
  task:
    scheduling:
      pool:
        # Relay da outbox, varredura de timeouts e métricas não podem esperar um pelo outro:
        # se o Kafka travar o relay, os timeouts da saga continuam andando.
        size: 3
  datasource:
    url: jdbc:postgresql://localhost:5433/transfers
    username: workshop
    password: workshop
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: transfer-service
      auto-offset-reset: earliest
    listener:
      # Commit do offset depois de cada mensagem processada: at-least-once (slide 14).
      ack-mode: record

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    # Além do console, cada serviço loga em logs/transfer-service.log: é onde o grep da apresentação procura.
    name: ${LOG_DIR:logs}/transfer-service.log
  level:
    # O cliente Kafka é muito verboso em INFO; deixamos os logs para a história da saga.
    org.apache.kafka: WARN
  pattern:
    # Toda linha com uma transferência no MDC ganha "transferId=1042 cid=TRF-1042.DEB-a1 "
    # (linhas sem contexto ficam como estão). É o que faz o grep da apresentação funcionar.
    correlation: "%replace(transferId=%X{transferId} ){'^transferId= $', ''}%replace(cid=%X{cid} ){'^cid= $', ''}"

saga:
  timeouts:
    # Quanto esperar por cada passo, e quantas vezes perguntar antes de NEEDS_ATTENTION.
    debit: 8s
    # O Pix precisa caber o retry do consumidor (1 s + 2 s + 4 s) antes da DLT.
    pix: 12s
    refund: 8s
    max-attempts: 3
