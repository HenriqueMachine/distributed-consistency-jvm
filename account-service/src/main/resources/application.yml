# Valores para rodar na máquina (./gradlew bootRun --parallel).
# No perfil "apps" do docker compose, as variáveis de ambiente sobrescrevem host e porta.
spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5434/accounts
    username: workshop
    password: workshop
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: account-service
      auto-offset-reset: earliest
    listener:
      # Commit do offset depois de cada mensagem processada: at-least-once (slide 28).
      ack-mode: record

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    # Além do console, cada serviço loga em logs/account-service.log: é onde o grep da apresentação procura.
    name: ${LOG_DIR:logs}/account-service.log
  level:
    # O cliente Kafka é muito verboso em INFO; deixamos os logs para a história da saga.
    org.apache.kafka: WARN
  pattern:
    # Toda linha com uma transferência no MDC ganha "transferId=1042 cid=TRF-1042.DEB-a1 "
    # (linhas sem contexto ficam como estão). É o que faz o grep da apresentação funcionar.
    correlation: "%replace(transferId=%X{transferId} ){'^transferId= $', ''}%replace(cid=%X{cid} ){'^cid= $', ''}"

simulation:
  debit-slow:
    # Quanto a resposta fica retida com X-Simulate: DEBIT_SLOW (slide 35: chega aos 15 s).
    delay: 15s
